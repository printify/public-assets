name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:
  code-review:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
      actions: read
    uses: fyulorg/agentic-review/.github/workflows/code-review.yml@v1.6.0
    with:
      trigger_mode: auto
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
